# .github/workflows/release-images.yml
#
# Build and push agent-teams service images to GHCR on every `v*` release tag.
# Also runnable manually via workflow_dispatch (no tag required — tags as "latest").
#
# Images published:
#   ghcr.io/bankung/agent-teams-api:<version>        + :latest
#   ghcr.io/bankung/agent-teams-web:<version>        + :latest
#   ghcr.io/bankung/agent-teams-langgraph:<version>  + :latest
#
# The web image uses web/Dockerfile.prod (multi-stage standalone Next.js build).
# api/Dockerfile is multi-stage as of Kanban #2529 (base -> dev/prod); this
# workflow builds the `prod` target explicitly (matrix.target below) rather
# than relying on prod happening to be the last/default stage. langgraph still
# uses its existing single-stage Dockerfile with no --reload.
#
# NOTE: this workflow only runs on a `v*` tag push (or manual workflow_dispatch)
# — the target: prod wiring below is exercised at the next release, not by
# editing this file.

name: Release — Build & Push Images to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            dockerfile: ./api/Dockerfile
            image: ghcr.io/bankung/agent-teams-api
            # api/Dockerfile is multi-stage (Kanban #2529). prod is last but
            # nothing should rely on the implicit default target — pin it.
            target: prod

          - service: web
            context: ./web
            dockerfile: ./web/Dockerfile.prod
            image: ghcr.io/bankung/agent-teams-web

          - service: langgraph
            context: ./langgraph
            dockerfile: ./langgraph/Dockerfile
            image: ghcr.io/bankung/agent-teams-langgraph

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # TODO pin to SHA

      - name: Log in to GHCR
        uses: docker/login-action@v3  # TODO pin to SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # On a tag push: refs/tags/v1.2.3 → "1.2.3"
          # On workflow_dispatch (no tag): fall back to "latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO pin to SHA

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5  # TODO pin to SHA
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Empty for web/langgraph (no matrix.target set) — build-push-action
          # omits --target entirely when this input is blank, so those two
          # builds are functionally unchanged.
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
